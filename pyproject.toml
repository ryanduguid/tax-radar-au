[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "au-tax-change-impact-monitor"
version = "0.1.3"
description = "A provenance-first synthetic change-review queue for Australian tax workflow sources"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ryan Duguid" }]
keywords = ["australia", "tax", "legislation", "provenance", "ai-agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
]
[project.urls]
Homepage = "https://github.com/ryanduguid/tax-radar-au"
Repository = "https://github.com/ryanduguid/tax-radar-au.git"
Issues = "https://github.com/ryanduguid/tax-radar-au/issues"

[project.optional-dependencies]
dev = [
    "ruff>=0.11", "mypy>=1.14","build>=1.2", "pytest>=8"]

[project.scripts]
au-tax-change-impact-monitor = "au_tax_change_impact_monitor.cli:main"

[tool.setuptools]
packages = ["au_tax_change_impact_monitor"]
include-package-data = false

[tool.setuptools.package-data]
au_tax_change_impact_monitor = ["samples/*/*.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["au_tax_change_impact_monitor", "tests"]

[tool.ruff.lint]
# First-enablement set: syntax and undefined-name errors only (E9, F82).
# Keep Decimal("10.00") money literals and existing import layout.
select = ["E9", "F82"]

[tool.mypy]
python_version = "3.10"
packages = ["au_tax_change_impact_monitor"]
ignore_missing_imports = true
pretty = true

